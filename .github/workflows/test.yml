# filepath: .github/workflows/test.yml
# purpose:  Run the full test suite on every push and pull request.

name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # allow manual runs

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet/Portfolio.Resilience.slnx

      - name: Build
        run: dotnet build dotnet/Portfolio.Resilience.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test dotnet/Portfolio.Resilience.slnx --no-build --configuration Release --verbosity normal
