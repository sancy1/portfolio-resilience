# filepath: .github/workflows/publish.yml
# purpose:  Publish all three Portfolio.Resilience packages to nuget.org when
#           a version tag is pushed. Uses Trusted Publishing (OIDC) - no API
#           keys stored anywhere.
#
# Packages published:
#   - Portfolio.Resilience                 (core)
#   - Portfolio.Resilience.OpenTelemetry   (optional, v0.7.0+)
#   - Portfolio.Resilience.Analyzers       (optional, v0.7.0+)
#
# nuget.org Trusted Publishing policy:
#   Package owner: sancy
#   Glob:          *
#   Repository:    sancy1/portfolio-resilience
#   Workflow:      publish.yml

name: publish

on:
  push:
    tags:
      - 'v*.*.*'      # v0.5.0, v1.0.0, v2.3.1, etc.
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  id-token: write      # required for OIDC token exchange with nuget.org
  contents: read       # required to checkout the repository

jobs:
  publish:
    name: Pack and publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet/Portfolio.Resilience.slnx

      - name: Build (Release)
        run: dotnet build dotnet/Portfolio.Resilience.slnx --no-restore --configuration Release

      - name: Test (Release)
        run: dotnet test dotnet/Portfolio.Resilience.slnx --no-build --configuration Release

      - name: Pack all three packages
        run: |
          dotnet pack dotnet/src/Portfolio.Resilience/Portfolio.Resilience.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack dotnet/src/Portfolio.Resilience.OpenTelemetry/Portfolio.Resilience.OpenTelemetry.csproj \
            --no-build --configuration Release --output ./nupkg
          dotnet pack dotnet/src/Portfolio.Resilience.Analyzers/Portfolio.Resilience.Analyzers.csproj \
            --no-build --configuration Release --output ./nupkg

      - name: List pack output
        run: ls -la ./nupkg

      # ---------------------------------------------------------------
      # Trusted Publishing (OIDC) - nuget.org validates the request
      # against the trust policy configured for this repository:
      #   Package owner: sancy
      #   Glob:          *
      #   Repository:    sancy1/portfolio-resilience
      #   Workflow:      publish.yml
      # One API key from this step can push every package the policy
      # permits.
      # ---------------------------------------------------------------
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: sancy

      - name: Push all packages to nuget.org
        run: |
          for pkg in ./nupkg/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push symbols (.snupkg) to nuget.org
        run: |
          for pkg in ./nupkg/*.snupkg; do
            echo "Pushing symbols $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || true
          done
        continue-on-error: true    # symbols upload is best-effort
