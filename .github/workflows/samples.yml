# filepath: .github/workflows/samples.yml
# purpose:  Builds and runs the runnable sample on every push and pull request
name: samples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore sample
        run: dotnet restore dotnet/samples/Samples.App/Samples.App.csproj

      - name: Build sample
        run: dotnet build dotnet/samples/Samples.App/Samples.App.csproj --no-restore --configuration Release

      - name: Run sample
        run: dotnet run --project dotnet/samples/Samples.App/Samples.App.csproj --no-build --configuration Release

      - name: Test sample
        run: dotnet test dotnet/samples/Samples.App.Tests/Samples.App.Tests.csproj --configuration Release